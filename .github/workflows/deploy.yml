name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
          SSH_HOST: ${{ secrets.GCP_VM_HOST }}
          SSH_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Missing GitHub secret GCP_VM_HOST"
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::Missing GitHub secret GCP_VM_USER"
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing GitHub secret GCP_VM_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/gcp_vm
          chmod 600 ~/.ssh/gcp_vm
          ssh-keygen -y -f ~/.ssh/gcp_vm >/dev/null
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host gcp-vm
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/gcp_vm
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          ssh -o BatchMode=yes gcp-vm 'echo "SSH connection ok"'

      - name: Deploy exact commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          APP_DIR: /opt/backend
          SERVICE_NAME: backend
          HEALTH_URL: https://api.withcouture.me/health
        run: |
          set -euo pipefail
          ssh gcp-vm "DEPLOY_SHA='$DEPLOY_SHA' REPO_URL='$REPO_URL' APP_DIR='$APP_DIR' SERVICE_NAME='$SERVICE_NAME' HEALTH_URL='$HEALTH_URL' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$APP_DIR"
          previous_sha="$(git rev-parse HEAD || true)"

          rollback() {
            echo "Deploy failed; rolling back to ${previous_sha:-unknown}"
            if [ -n "${previous_sha:-}" ]; then
              git fetch origin main
              git checkout --force "$previous_sha"
              npm ci --omit=dev
              sudo systemctl restart "$SERVICE_NAME"
            fi
          }
          trap rollback ERR

          git remote set-url origin "$REPO_URL"
          git fetch origin main
          git checkout --force "$DEPLOY_SHA"
          npm ci --omit=dev
          sudo systemctl restart "$SERVICE_NAME"

          for attempt in $(seq 1 12); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              trap - ERR
              echo "Deploy succeeded: $DEPLOY_SHA"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed after restart"
          exit 1
          REMOTE
